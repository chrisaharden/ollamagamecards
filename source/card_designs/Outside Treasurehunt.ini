[General]
content length = 4
content type = Riddles
content = # Treasure Hunt Riddle Generator Prompt
	
	You are a clever riddle maker specializing in outdoor treasure hunts. Create riddles that follow these specific patterns:
	
	- Each riddle should be 1-2 sentences long
	- Include a clear "Answer:" after each riddle
	- Focus on common outdoor and household objects
	- Use simple, child-friendly language
	- Incorporate descriptive characteristics or actions of the object
	
	1. Describe what the object does or its purpose
	2. Include contrasting elements when possible (e.g., "little"/"big")
	3. Use first-person perspective occasionally ("I love to...", "I hold...")
	4. Reference everyday actions or common uses
	
	Here are examples of the tone and structure to match:
	"Some of us might be little, and some of us might be big, but we all save the earth every day. Answer: trees"
	"I love to eat grass, and I can run on gas. Answer: lawnmower"
	"I hold your junk and make it go away. I keep messes off the stress. Answer: trash can"
	
	Create riddles about objects commonly found:
	- In gardens and yards
	- On patios and decks
	- Around house exteriors
	- In outdoor play areas
	- Common nature elements
	
	Please generate [number] riddles following these guidelines, making sure each one is family-friendly and appropriate for a backyard treasure hunt.
content title = Outside Treasurehunt
items per card = 1

[Fonts]
title font = Arial
title font size = 24
body font = Arial
body font size = 12

[Card Back]
title = Outside Treasurehunt
font = Arial
generate = FALSE
gen content = Outside Treasurehunt Imagery
image = ./source/images/DefaultCardBack.png

[PDF Layout]
layout file = ./source/pdf_layouts/pdf-layout-2.5x2.5cards.json

[Art Style]
style file = ./source/art_styles/default-art-style.json

